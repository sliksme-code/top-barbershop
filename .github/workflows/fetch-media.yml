name: fetch-media
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Unsplash photo ids, space separated'
        required: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download photos
        env:
          IDS: ${{ inputs.ids }}
        run: |
          mkdir -p out && cd out
          # формат: имя=https://images.unsplash.com/photo-...
          for item in $IDS; do
            n="${item%%=*}"; u="${item#*=}"
            curl -sL -A "Mozilla/5.0" "$u" -o "$n.jpg" || true
            echo "$n $(file -b "$n.jpg" | cut -c1-70)" >> info.txt
          done
          cat info.txt
      - name: Push to temp branch
        run: |
          cd out
          git init -q && git checkout -q -b media-tmp
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -qm media
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" media-tmp
