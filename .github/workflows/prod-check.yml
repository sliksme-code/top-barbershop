name: prod-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in 80 443 21; do timeout 6 bash -c "</dev/tcp/92.53.96.50/$p" && echo "tcp $p open" || echo "tcp $p closed"; done
          curl -s -o /dev/null -w "tw1 %{http_code} %{size_download}\n" -H 'Cookie: realauth=SvBD85dINu3' --max-time 15 https://top-barbershop.tw1.ru/
          R="--resolve top-barbershop.com:443:136.234.232.234"
          for p in / /place/portos/; do curl -s $R -o /dev/null -w "$p %{http_code}\n" --max-time 30 https://top-barbershop.com$p; done
