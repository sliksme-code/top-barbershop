name: prod-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          R="--resolve top-barbershop.com:443:136.234.232.234 --resolve www.top-barbershop.com:443:136.234.232.234"
          for p in / /place/portos/ /poin/ /api/health/; do curl -s $R -D /tmp/h -o /tmp/b -w "$p %{http_code} %{size_download}B\n" --max-time 30 https://top-barbershop.com$p; grep -i retry-after /tmp/h; done
          grep -o '<h1>[^<]*' /tmp/b || true
          curl -s $R -o /dev/null -w "www %{http_code} %{redirect_url}\n" https://www.top-barbershop.com/
