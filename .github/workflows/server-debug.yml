name: server-debug
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: base64 shell script
        required: true
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        env:
          CMD: ${{ inputs.cmd }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: CMD
          command_timeout: 10m
          script: |
            cd /opt/top-barbershop
            echo "$CMD" | base64 -d > /tmp/dbg.sh
            bash /tmp/dbg.sh 2>&1
