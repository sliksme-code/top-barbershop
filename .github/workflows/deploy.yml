name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/sliksme-code/top-barbershop-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          build-args: |
            SITE_URL=https://${{ vars.SITE_DOMAIN || 'new.top-barbershop.com' }}
            SITE_ENV=${{ vars.SITE_ENV || 'staging' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Копируем конфигурацию на сервер
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,deploy/"
          target: /opt/top-barbershop
      - name: Обновляем контейнеры
        uses: appleboy/ssh-action@v1.2.0
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          envs: ENV_FILE
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/top-barbershop
            if [ ! -f .env ]; then printf '%s\n' "$ENV_FILE" > .env; chmod 600 .env; fi
            test -s .env || { echo "Нет .env: задайте секрет ENV_FILE"; exit 1; }
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            WEB_TAG=${{ github.sha }} docker compose pull web
            WEB_TAG=${{ github.sha }} docker compose up -d --remove-orphans
            docker compose exec -T caddy caddy reload --config /etc/caddy/deploy/Caddyfile --adapter caddyfile
            docker image prune -f
            sleep 45
            docker compose ps
            docker compose logs --tail 30 directus
            curl -s -o /dev/null -w 'poin: %{http_code}\n' -H 'Host: '$(grep ^SITE_DOMAIN .env | cut -d= -f2) http://127.0.0.1/poin/ || true
