name: fetch-legacy-data
# Ручной запуск: забирает со старого хостинга (FTP Timeweb) дамп БД WordPress и папку uploads на новый сервер.
# Данные кладутся в /opt/top-barbershop/legacy (вне веба). Доступы — в секрете ENV_FILE (OLD_FTP_*).
on:
  workflow_dispatch:
    inputs:
      what:
        description: "Что забрать: dump | uploads | all"
        default: all

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          envs: ENV_FILE
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 120m
          script: |
            set -e
            cd /opt/top-barbershop
            if [ -n "$ENV_FILE" ]; then printf '%s\n' "$ENV_FILE" > .env; chmod 600 .env; fi
            set -a; . ./.env; set +a
            : "${OLD_FTP_HOST:?нет OLD_FTP_HOST в ENV_FILE}"
            mkdir -p legacy && chmod 700 legacy
            WHAT="${{ github.event.inputs.what }}"
            run_lftp() { docker run --rm -v "$PWD/legacy:/legacy" -e LFTP_PASSWORD="$OLD_FTP_PASS" alpine:3.20 sh -c "apk add -q lftp && lftp --env-password -u '$OLD_FTP_USER' -e \"set ftp:ssl-allow yes; set ssl:verify-certificate no; set net:max-retries 3; $1; bye\" '$OLD_FTP_HOST'"; }
            echo "== содержимое корня FTP"; run_lftp "cls -l ${OLD_FTP_ROOT:-/}" | head -40 || true
            if [ "$WHAT" = dump ] || [ "$WHAT" = all ]; then
              run_lftp "get -c ${OLD_FTP_ROOT}/_QUARANTINE_2026-11-12_untitl_topbs_20260716.sql -o /legacy/wp-dump.sql"
              ls -la legacy/wp-dump.sql && head -c 300 legacy/wp-dump.sql
            fi
            if [ "$WHAT" = uploads ] || [ "$WHAT" = all ]; then
              run_lftp "mirror -c --parallel=4 ${OLD_FTP_ROOT}/public_html/wp-content/uploads /legacy/uploads"
              run_lftp "mirror -c ${OLD_FTP_ROOT}/public_html/logos /legacy/logos"
              du -sh legacy/uploads legacy/logos; find legacy/uploads -type f | wc -l
            fi
