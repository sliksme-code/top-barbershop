name: cleanup-branch
on:
  workflow_dispatch:
    inputs:
      branch:
        description: ветка
        default: data-export
permissions:
  contents: write
jobs:
  del:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          B: ${{ inputs.branch || 'data-export' }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$B" && echo "удалена $B" || echo "нет ветки $B"
